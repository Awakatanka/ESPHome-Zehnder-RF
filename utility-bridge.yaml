substitutions:
  devicename: ventilatie
  upper_devicename: Ventilatie

esphome:
  name: ${devicename}
  comment: Ventilatie aansturing

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino   # de component is gebouwd/getest met Arduino; niet wijzigen zonder te testen

# Zet op DEBUG alleen tijdens het zoeken naar problemen
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_ventilatie

ota:
  - platform: esphome
    password: !secret ventilatie_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    # Vul hier je eigen vaste IP-adres in (192.168.1.x is een voorbeeld!)
    static_ip: 192.168.1.x
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  ap:
    ssid: "ventilatie Fallback"
    password: !secret ventilatie_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Amsterdam

# https://esphome.io/components/external_components.html#external-components-git
# Tip: zet bij 'ref' een tag of commit-hash zodra het werkt, zodat een latere wijziging niets breekt.
external_components:
  - source:
      type: git
      url: https://github.com/Awakatanka/ESPHome-Zehnder-RF
      ref: main
    refresh: 1d
  # Lokaal testen vanuit deze map (haal het blok hierboven dan weg):
  # - source:
  #     type: local
  #     path: components

# ---------- SPI (VSPI) ----------
spi:
  clk_pin: GPIO18   # SCK
  mosi_pin: GPIO23
  miso_pin: GPIO19

# ---------- nRF905 ----------
nrf905:
  id: nrf905_rf
  cs_pin: GPIO17    # CSN
  cd_pin: GPIO33
  ce_pin: GPIO27
  pwr_pin: GPIO26
  txen_pin: GPIO25  # TX_EN
  # Gebruik de GND naast 3V3 of de GND bij GPIO23/18.
  # am_pin en dr_pin zijn niet nodig; de status wordt via SPI uitgelezen.

# ---------- ZEHNDER FAN ----------
fan:
  - platform: zehnder
    id: zehnder_fan
    name: "Ventilatie"
    nrf905: nrf905_rf
    update_interval: 60s
    setup_priority: -100

# ---------- Knoppen ----------
# De knoppen gebruiken fan.turn_on, zodat de status in Home Assistant meeloopt
# en de opdracht in de wachtrij komt als de radio net bezig is.
button:
  - platform: restart
    id: ${devicename}_esphome_restart
    name: ${upper_devicename} herstart

  - platform: template
    id: ${devicename}_low
    name: ${upper_devicename} Low
    on_press:
      - fan.turn_on:
          id: zehnder_fan
          speed: 1

  - platform: template
    id: ${devicename}_medium
    name: ${upper_devicename} Medium
    on_press:
      - fan.turn_on:
          id: zehnder_fan
          speed: 2

  - platform: template
    id: ${devicename}_high
    name: ${upper_devicename} High
    on_press:
      - fan.turn_on:
          id: zehnder_fan
          speed: 3

  # LET OP: wist ook de opgeslagen koppeling met de Zehnder.
  # Zet de Zehnder daarna 10 s spanningsloos en herstart de ESP om opnieuw te koppelen.
  - platform: factory_reset
    id: ${devicename}_reset_pairing
    name: ${upper_devicename} Reset & Pair
